# What each platform accepts and what its viewers see. Used by vlog_platform.py and by the skill when it writes the
# upload package.
#
# PLATFORMS CHANGE THEIR RULES OFTEN. `checked` is the month a block was last read on the platform's own help page,
# and `verified` says which of its lines that reading covered; every other line is from general knowledge and may
# be out of date. Before relying on a limit that matters for a video (a length, a link rule), Claude looks at the
# platform's own help page and corrects this file.
# Add a platform by copying a block. Times are seconds, sizes pixels, bytes where it says so.

[youtube]
checked = "2026-11"
verified = "length and file size (Help: Upload videos longer than 15 minutes); thumbnail size and limits (Help: Add custom thumbnails)"
name = "YouTube (long video)"
shape = "wide"                  # 16:9
max_seconds = 43200             # 12 hours or 256 GB, whichever is less (verified accounts); 15 minutes for an unverified one
thumbnail_ratio = [16, 9]
thumbnail_min = 640             # smallest width; YouTube recommends 3840 x 2160, as large as possible
thumbnail_max_bytes = 2000000   # 2 MB when uploaded from a phone; 50 MB from a computer
links_in_text = true            # links in the description can be clicked
chapters = true                 # 00:00 lines in the description become chapters (at least three, each 10 s or longer)
title_max = 100
text_max = 5000
subtitles = "files"             # subtitle files are uploaded per language; burned-in ones stay as they are
notes = "End screen in the last 5-20 s; the studio's end card keeps its slots clear. A vertical video with a 16:9 thumbnail gets an automatic 4:5 one on the home page."

[youtube_shorts]
checked = "2026-11"
verified = "length and shape (Help: Understand three-minute YouTube Shorts); thumbnail (Help: Add custom thumbnails)"
name = "YouTube Shorts"
shape = "tall"                  # square or vertical, up to three minutes, is a Short
max_seconds = 180
cover_ratio = [9, 16]           # a custom Shorts thumbnail: 9:16, recommended 2160 x 3840, height at least 640
cover_min = 640
links_in_text = false           # links in a Short's description cannot be clicked: name the related video instead
title_max = 100
text_max = 5000
safe_bottom = 0.20              # share of the height at the bottom covered by the title and buttons
safe_right = 0.14
notes = "A custom Shorts thumbnail can only be added in YouTube Studio on a computer, by a verified account. A Short over one minute with any copyright claim (music) is blocked everywhere. A related long video can be attached in the upload settings."

[instagram]
checked = "2026-11"
verified = "length (Help: Record a reel on Instagram)"
name = "Instagram Reels"
shape = "tall"
max_seconds = 1200              # a reel can be up to 20 minutes
recommended_seconds = 180       # "Reels over 3 minutes won't be recommended to new audiences"
cover_ratio = [9, 16]
cover_safe = [1080, 1350]       # the profile grid crops the cover (3:4, centred): words and faces inside this box are always kept
links_in_text = false           # a caption link cannot be clicked: point to the link in the profile
text_max = 2200
hashtags_max = 30               # a few that fit work better than many
safe_bottom = 0.22
safe_right = 0.14
notes = "The first line of the caption is what shows before 'more'. Music from another platform's library may be muted: check the track's licence covers Instagram."

[facebook]
checked = "2026-11"
verified = "subtitle file names (Help: What is the naming convention for SubRip (.srt) files?)"
name = "Facebook Reels"
shape = "tall"
max_seconds = 1200              # not read on a help page: assumed the same as Instagram
recommended_seconds = 180
links_in_text = true            # links can be clicked in a post or a comment, less reliably in a Reel caption
text_max = 2200
safe_bottom = 0.22
safe_right = 0.14
subtitles = "files"             # only files named filename.[language code]_[country code].srt, from Facebook's list of pairs
notes = "Posted together with Instagram from Meta Business Suite as a Reel (a normal post does not take 9:16 video). Subtitle files are added per language after upload."

[tiktok]
checked = "2026-11"
verified = "length (Support: Camera tools, Video length)"
name = "TikTok"
shape = "tall"
max_seconds = 3600              # an uploaded video can be up to 60 minutes; one recorded in the app up to 10
recommended_seconds = 180       # general advice, not a rule: shorter travels further
links_in_text = false
text_max = 2200
safe_bottom = 0.22
safe_right = 0.14
notes = "A visible watermark of another platform lowers reach: upload the clean file, never a download from another app."

[xiaohongshu]
checked = "never"                 # nothing here was read on the platform's own pages: check before relying on it
name = "小红书"
shape = "tall"                  # 3:4 and 9:16 both work; the cover is shown at 3:4 in the feed
max_seconds = 900
cover_safe = [1080, 1440]
links_in_text = false
title_max = 20
text_max = 1000
notes = "The title is short (about 20 characters). Outside links and other platforms' names are held back."

[bilibili]
checked = "never"                 # nothing here was read on the platform's own pages: check before relying on it
name = "哔哩哔哩"
shape = "wide"
max_seconds = 36000
thumbnail_ratio = [16, 10]      # its own 16:10 cover
links_in_text = true
title_max = 80
text_max = 2000
notes = "A 16:9 video with its own cover; tags and a category are chosen at upload."
